name: Build App

on:
  push:
    branches: ["main"]
  pull_request: {}
  schedule:
    - cron: "59 23 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          # Gradle 8.14.x and AGP 8.x are not compatible with JDK 25.
          # Use the supported Java 17 LTS toolchain for reproducible Android builds.
          java-version: "17"
          distribution: "temurin"

      - uses: subosito/flutter-action@v2
        with:
          # Pin the SDK so dependency resolution and CI results are reproducible.
          flutter-version: "3.47.7"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Analyze
        run: flutter analyze .

      - name: Validate release signing secrets
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required release signing secret ${name} is not configured."
              exit 1
            fi
          done

      - name: Decode Keystore
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: "dev_keystore.jks"
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Assemble release APKs
        run: flutter build apk --release --split-per-abi
        env:
          SIGNING_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: tasks-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tasks-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tasks-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
