name: Build App

on:
  push:
    branches: ["main"]
  pull_request: {}
  schedule:
    - cron: "59 23 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - uses: actions/setup-java@v6
        with:
          # Gradle 8.14.x and AGP 8.x are not compatible with JDK 25.
          # Use the supported Java 17 LTS toolchain for reproducible Android builds.
          java-version: "17"
          distribution: "temurin"

      - uses: subosito/flutter-action@v2
        with:
          # Pin the SDK so dependency resolution and CI results are reproducible.
          flutter-version: "3.47.7"

      - name: Install Firestore rules test dependencies
        run: npm install --no-audit --no-fund

      - name: Test Firestore security rules in the emulator
        run: npm run test:rules

      - name: Install Flutter dependencies from the committed lockfile
        run: flutter pub get --enforce-lockfile

      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify dependency lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Analyze
        run: flutter analyze .

      - name: Prepare release metadata
        id: release_meta
        run: |
          set -euo pipefail
          VERSION_LINE="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          VERSION="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE#*+}"
          if [ "$BUILD_NUMBER" = "$VERSION_LINE" ]; then BUILD_NUMBER=1; fi
          SHORT_SHA="${GITHUB_SHA::12}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            SIGNING_MODE=unsigned
          else
            SIGNING_MODE=signed
          fi
          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "short_sha=$SHORT_SHA"
            echo "signing_mode=$SIGNING_MODE"
          } >> "$GITHUB_OUTPUT"

      # Pull requests (especially from forks) do not receive repository secrets.
      # They still run a release-mode build, unsigned, after all quality gates pass.
      - name: Validate release signing secrets
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required release signing secret ${name} is not configured."
              exit 1
            fi
          done

      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: "release_keystore.jks"
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Assemble release APKs
        run: flutter build apk --release --split-per-abi
        env:
          SIGNING_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Create release manifest and checksums
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          cd "$APK_DIR"
          sha256sum app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk > SHA256SUMS
          cat > RELEASE-METADATA.txt <<EOF
          App version: ${{ steps.release_meta.outputs.version }}
          Build number: ${{ steps.release_meta.outputs.build_number }}
          Commit: $GITHUB_SHA
          Ref: $GITHUB_REF
          Signing: ${{ steps.release_meta.outputs.signing_mode }}
          Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: tasks-v${{ steps.release_meta.outputs.version }}-${{ steps.release_meta.outputs.short_sha }}-${{ steps.release_meta.outputs.signing_mode }}-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: tasks-v${{ steps.release_meta.outputs.version }}-${{ steps.release_meta.outputs.short_sha }}-${{ steps.release_meta.outputs.signing_mode }}-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: tasks-v${{ steps.release_meta.outputs.version }}-${{ steps.release_meta.outputs.short_sha }}-${{ steps.release_meta.outputs.signing_mode }}-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: tasks-v${{ steps.release_meta.outputs.version }}-${{ steps.release_meta.outputs.short_sha }}-release-metadata
          path: |
            build/app/outputs/flutter-apk/SHA256SUMS
            build/app/outputs/flutter-apk/RELEASE-METADATA.txt
          if-no-files-found: error
          retention-days: 14
